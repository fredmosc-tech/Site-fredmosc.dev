    <!-- Link curto para palco e slides: fredmosc.tech/devcheck?e=<evento>
         Leva ao DevCheck com UTM: utm_source=fredmosc.tech, utm_medium=link-curto,
         utm_campaign=palco-<evento> (ou "link-curto" quando não vier evento). -->
    <meta http-equiv="refresh" content="2;url=https://dev-check.gridstart.pro/?utm_source=fredmosc.tech&amp;utm_medium=link-curto&amp;utm_campaign=link-curto">
    <script>
        (function () {
            var e = (new URLSearchParams(location.search).get('e') || '').toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 40);
            var camp = e ? 'palco-' + e : 'link-curto';
            location.replace('https://dev-check.gridstart.pro/?utm_source=fredmosc.tech&utm_medium=link-curto&utm_campaign=' + encodeURIComponent(camp));
        })();
    </script>
